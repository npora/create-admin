name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run

  templates:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        framework: [vue, react]
        manager: [npm, pnpm]
    steps:
      - name: Check out this generator revision
        uses: actions/checkout@v4
        with:
          path: create-nova-admin
          persist-credentials: false
      - name: Check out the selected template
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.framework == 'react' && 'npora/admin-template-react' || 'npora/admin-template' }}
          ref: main
          path: template
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        if: matrix.manager == 'pnpm'
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Install generator dependencies
        run: npm ci --prefix create-nova-admin
      - name: Generate and install a starter project
        env:
          FRAMEWORK: ${{ matrix.framework }}
          MANAGER: ${{ matrix.manager }}
        run: |
          node create-nova-admin/bin/index.js generated-admin --yes \
            --framework "$FRAMEWORK" --template-dir template --install "$MANAGER"
      - name: Check and build the generated project
        working-directory: generated-admin
        run: |
          npm run check:all
          npm run build
