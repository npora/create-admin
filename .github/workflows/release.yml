name: Publish generator

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'npora/create-admin'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    defaults:
      run:
        working-directory: create-nova-admin
    steps:
      - uses: actions/checkout@v6
        with:
          path: create-nova-admin
          persist-credentials: false
      - name: Check out the matching template release
        uses: actions/checkout@v6
        with:
          repository: npora/admin-template
          ref: ${{ github.ref_name }}
          path: admin-template
          persist-credentials: false
      - name: Check out the React template
        uses: actions/checkout@v6
        with:
          repository: npora/admin-template-react
          ref: main
          path: admin-template-react
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11
      - run: node ../admin-template/scripts/release/verify.mjs "$RELEASE_TAG"
      - run: npm ci
      - run: npm run check
      - name: Generate, install and check both starter projects
        run: |
          cd ..
          for framework in vue react; do
            template=admin-template
            if [ "$framework" = react ]; then template=admin-template-react; fi
            node create-nova-admin/bin/index.js "generated-$framework" --yes \
              --framework "$framework" --template-dir "$template" --install npm
            (
              cd "generated-$framework"
              npm run check:all
              npm run build
            )
          done
      - run: npm pack --dry-run
      - name: Publish npm package with trusted publishing
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const spec = `${pkg.name}@${pkg.version}`
          let published
          try {
            published = JSON.parse(execFileSync('npm', ['view', spec, 'dist.integrity', '--json'], { encoding: 'utf8' }))
          } catch (error) {
            let code
            try { code = JSON.parse(error.stdout).error?.code } catch {}
            if (code !== 'E404') throw error
          }
          if (published) {
            const [local] = JSON.parse(execFileSync('npm', ['pack', '--dry-run', '--json'], { encoding: 'utf8' }))
            if (local.integrity !== published) throw new Error(`${spec} already exists with different contents`)
            console.log(`${spec} already published with identical contents`)
          } else {
            execFileSync('npm', ['publish', '--access', 'public'], { stdio: 'inherit' })
          }
          NODE
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo npora/create-admin >/dev/null 2>&1 ||
            gh release create "$RELEASE_TAG" --repo npora/create-admin --verify-tag --generate-notes
